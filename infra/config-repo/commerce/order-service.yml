server:
  port: 0

spring:
  cloud:
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
          product-service:
            loggerLevel: BASIC
          inventory-service:
            connectTimeout: 1000
            readTimeout: 2000
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:dbuser}
    password: ${ORDER_DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never

logging:
  level:
    ru.yandex.practicum.order.feign.ProductClient: DEBUG
