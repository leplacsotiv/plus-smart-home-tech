server:
  port: 0

spring:
  cloud:
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 2000
          product-service:
            loggerLevel: BASIC
          inventory-service:
            connectTimeout: 1000
            readTimeout: 2000
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:dbuser}
    password: ${ORDER_DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never

logging:
  level:
    ru.yandex.practicum.order.feign.ProductClient: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - ru.yandex.practicum.order.exception.OrderProcessingException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
